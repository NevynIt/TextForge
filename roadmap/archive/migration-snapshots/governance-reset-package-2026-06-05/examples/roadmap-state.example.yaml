schema_version: 1

status_values:
  - candidate
  - defined
  - ready
  - in-progress
  - implemented
  - validated
  - blocked
  - deferred
  - archived

modules:
  MOD-ROADMAP:
    title: Roadmap governance
    path: modules/roadmap-governance.md
    status: active
    owns:
      - roadmap structure
      - roadmap conventions
    depends_on: []
    enables:
      - WP-ROADMAP-CLEANUP

workpackages:
  WP-ROADMAP-CLEANUP:
    title: Roadmap cleanup and governance reset
    path: workpackages/WP-ROADMAP-CLEANUP.md
    module: MOD-ROADMAP
    status: in-progress
    type: governance
    depends_on: []
    enables: []
    release_candidates:
      - R-ROADMAP-RESET
    production_required: true
    deferrable: false
    key_adrs:
      - ADR-0001
    archive_trace:
      - archive/rapid/RAPID-up-to-2026-06-05.md

releases:
  R-ROADMAP-RESET:
    title: Roadmap governance reset
    status: in-progress
    workpackages:
      - WP-ROADMAP-CLEANUP
    target_outcome: Clean module/workpackage/release-based roadmap

adrs:
  ADR-0001:
    title: Roadmap governance reset
    status: accepted
    path: decisions/ADR-0001-roadmap-governance-reset.md
    supersedes: []
